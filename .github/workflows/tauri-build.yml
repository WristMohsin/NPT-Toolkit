name: Tauri Build (Windows)

on:
  push:
    branches: [ feature/tauri-desktop, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Create default icons (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
            # Create a minimal valid 1x1 PNG and let tauri icon generate the rest
            # Using a tiny base64 PNG
            $pngBase64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
            $bytes = [Convert]::FromBase64String($pngBase64)
            [IO.File]::WriteAllBytes("$pwd/src-tauri/icons/icon.png", $bytes)
            npx tauri icon src-tauri/icons/icon.png
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: -- --bundles nsis
          includeDebug: false
          includeRelease: true
          uploadRelease: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ANPT-Toolkit-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: error
          retention-days: 14
